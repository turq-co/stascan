name: Build

# Builds every push and pull request, so a broken build or missing translation never reaches a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (warnings are errors)
        run: dotnet build StaScan.csproj -c Release -warnaserror

      - name: Check translations
        shell: pwsh
        run: ./tools/check-i18n.ps1
